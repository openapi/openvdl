openvdl: "0.1"
id: "openvdl/maintained"
version: "0.1.0"
name: "OpenVDL Maintained Validator Library"
description: "Entry point for validators curated and maintained by the OpenVDL project."
imports:
  - "./email/openvdl.yml"
  - "./phone/openvdl.yml"
